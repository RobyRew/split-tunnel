[package]
name = "split-tunnel"
version = "0.3.1"
description = "Route a single Windows application through your own VPS over SOCKS5"
authors = ["RobyRew"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Deliberately minimal. Every extra crate is another way the Windows CI build
# can break, and this program's job is small: supervise one child process.
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTPS for the OIDC device flow and the enrollment call. ureq over rustls,
# not reqwest: no async runtime, no native OpenSSL, and therefore nothing for
# the Windows CI build to fail on.
ureq = { version = "2", features = ["json", "tls"], default-features = false }

# Generates the ed25519 keypair whose public half is sent for signing. The
# private half is written locally and never transmitted.
ssh-key = { version = "0.6", features = ["ed25519", "std", "getrandom"], default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

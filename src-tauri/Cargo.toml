[package]
name = "split-tunnel"
version = "0.1.0"
description = "Route a single Windows application through your own VPS over SOCKS5"
authors = ["RobyRew"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Deliberately minimal. Every extra crate is another way the Windows CI build
# can break, and this program's job is small: supervise one child process.
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

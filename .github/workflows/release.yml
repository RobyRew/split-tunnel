name: build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # plink drives the tunnel and is the only SSH client that talks to
      # Pageant, so it is bundled for users without PuTTY installed. Verified
      # against the checksums published alongside the binaries — a corrupted or
      # truncated download must fail the build, not ship.
      - name: Fetch and verify PuTTY tools
        shell: pwsh
        run: |
          $dir = "src-tauri/bin"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $base = "https://the.earth.li/~sgtatham/putty/latest"
          Invoke-WebRequest "$base/w64/plink.exe"   -OutFile "$dir/plink.exe"
          Invoke-WebRequest "$base/w64/pageant.exe" -OutFile "$dir/pageant.exe"
          Invoke-WebRequest "$base/sha512sums"      -OutFile "$env:TEMP/sha512sums"
          foreach ($t in @("plink","pageant")) {
            $line = Select-String -Path "$env:TEMP/sha512sums" -Pattern "w64/$t\.exe$" | Select-Object -First 1
            if (-not $line) { throw "no published checksum for $t.exe" }
            $want = ($line.Line -split '\s+')[0].ToLower()
            $got  = (Get-FileHash "$dir/$t.exe" -Algorithm SHA512).Hash.ToLower()
            if ($want -ne $got) { throw "checksum mismatch for $t.exe" }
            Write-Host "verified $t.exe"
          }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build installer
        run: cargo tauri build

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/ -ErrorAction Stop
          Get-ChildItem dist | ForEach-Object { Write-Host $_.Name $_.Length }

      - uses: actions/upload-artifact@v4
        with:
          name: SplitTunnel-installer
          path: dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

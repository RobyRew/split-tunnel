name: build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # plink drives the tunnel and is the only SSH client that talks to
      # Pageant, so it is bundled for users without PuTTY installed. Verified
      # against the checksums published alongside the binaries — a corrupted or
      # truncated download must fail the build, not ship.
      - name: Fetch and verify PuTTY tools
        shell: pwsh
        run: |
          $dir = "src-tauri/bin"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $base = "https://the.earth.li/~sgtatham/putty/latest"
          Invoke-WebRequest "$base/w64/plink.exe"   -OutFile "$dir/plink.exe"
          Invoke-WebRequest "$base/w64/pageant.exe" -OutFile "$dir/pageant.exe"
          Invoke-WebRequest "$base/sha512sums"      -OutFile "$env:TEMP/sha512sums"
          foreach ($t in @("plink","pageant")) {
            $line = Select-String -Path "$env:TEMP/sha512sums" -Pattern "w64/$t\.exe$" | Select-Object -First 1
            if (-not $line) { throw "no published checksum for $t.exe" }
            $want = ($line.Line -split '\s+')[0].ToLower()
            $got  = (Get-FileHash "$dir/$t.exe" -Algorithm SHA512).Hash.ToLower()
            if ($want -ne $got) { throw "checksum mismatch for $t.exe" }
            Write-Host "verified $t.exe"
          }

      - name: Fetch and verify wstunnel
        shell: pwsh
        env:
          WSTUNNEL_VERSION: "10.6.2"
        run: |
          $dir = "src-tauri/bin"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $tag = "v$env:WSTUNNEL_VERSION"
          $file = "wstunnel_${env:WSTUNNEL_VERSION}_windows_amd64.tar.gz"
          $url = "https://github.com/erebe/wstunnel/releases/download/$tag/$file"
          Invoke-WebRequest $url -OutFile "$env:TEMP/$file"
          tar -xzf "$env:TEMP/$file" -C $dir wstunnel.exe
          if (-not (Test-Path "$dir/wstunnel.exe")) { throw "wstunnel.exe missing from $file" }
          $v = & "$dir/wstunnel.exe" --version
          if ($v -notmatch $env:WSTUNNEL_VERSION) {
            throw "wstunnel reports '$v', expected $env:WSTUNNEL_VERSION"
          }
          Write-Host "verified $v"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build installer
        env:
          # Signs the update artifacts. The matching public key is baked into
          # tauri.conf.json, and the installed app refuses any update whose
          # signature does not verify against it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build

      # The app is useless without plink, and a silently-missing resource would
      # only show up as "cannot start plink" on a user's machine. Assert the
      # tools are actually inside the installer before we ship it.
      - name: Verify bundled tools made it into the installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          # -join is load-bearing: 7z returns an ARRAY of lines, and PowerShell's
          # -notlike/-notmatch on an array returns the filtered array rather than
          # a boolean, so the test would pass or fail almost at random.
          $list = (& 7z l $exe.FullName) -join "`n"
          foreach ($t in @("plink.exe","pageant.exe","wstunnel.exe")) {
            if ($list -notlike "*$t*") {
              Write-Host $list
              throw "$t is NOT bundled in the installer"
            }
            Write-Host "bundled: $t"
          }

      # wstunnel carries SSH inside a WebSocket on 443, for networks that
      # proxy HTTPS and drop direct TCP. Pinned and checksum-verified for the
      # same reason as the PuTTY tools: a corrupted download must fail the
      # build, not ship.
      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/ -ErrorAction Stop
          Get-ChildItem dist | ForEach-Object { Write-Host $_.Name $_.Length }

      - uses: actions/upload-artifact@v4
        with:
          name: SplitTunnel-installer
          path: dist/*.exe

      # The updater feed. The app fetches this, compares versions, downloads the
      # named installer and verifies `signature` before installing anything.
      - name: Build the update manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) {
            throw "no .sig beside $($exe.Name) - the signing key was probably not set, and an unsigned release is silently un-updatable"
          }
          $version = "${{ github.ref_name }}" -replace '^v',''
          $manifest = [ordered]@{
            version   = $version
            notes     = "See the release notes for $version."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($exe.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content dist/latest.json -Encoding utf8
          Write-Host "--- latest.json ---"
          Get-Content dist/latest.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.json
          generate_release_notes: true

# SplitTunnel enrollment service — optional.
#
# Without this, you hand every user's public key to the server by dropping a
# .pub into ../pubkeys and restarting. That is perfectly fine for one or two
# people. This service replaces it for larger or less-trusted groups: the user
# signs in to your identity provider, and the server signs a short-lived SSH
# certificate for a key generated on their own machine.
#
#   Setup:
#     1. Create the CA (once — losing this forces everyone to re-enrol):
#          mkdir -p ca && ssh-keygen -t ed25519 -f ca/tunnel_ca -C "tunnel CA" -N ""
#          chown 8023:8023 ca/tunnel_ca && chmod 400 ca/tunnel_ca
#     2. Copy config.example.json to config/config.json and fill it in.
#     3. Trust the CA in the tunnel container by putting the PUBLIC half at
#          ../ca/tunnel_ca.pub
#        The sshd hardening script picks it up automatically on restart.
#     4. docker compose up -d --build
#     5. Put a TLS-terminating reverse proxy in front of :8080. HTTPS is not
#        optional — the reply carries the host key the client is about to pin.

services:
  enroll:
    build:
      context: .
    image: split-tunnel-enroll:local
    container_name: tunnel-enroll
    restart: unless-stopped

    # Loopback only: expose it through your reverse proxy, never directly.
    ports:
      - "127.0.0.1:8087:8080"

    volumes:
      - ./config:/config:ro
      - ./ca:/ca:ro
      - ./state:/state

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25

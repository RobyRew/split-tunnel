# Resolver for the split-tunnel container only.
# Points at the dnsmasq instance that auto-populates the egress allowlist.
# NOTE: resolv.conf cannot express a port, which is why dnsmasq listens on
# 127.0.0.1:53 (free — systemd-resolved uses 127.0.0.53 and .54).
nameserver 127.0.0.1
options ndots:0

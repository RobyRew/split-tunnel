# Managed by Ansible — resolver used ONLY by the split-tunnel container.
#
# WHY THIS EXISTS
# A static IP allowlist cannot work for Spotify: audio and images come from
# *.scdn.co, *.spotifycdn.com and Akamai/Fastly hostnames that rotate
# constantly and vary by region. Resolving a fixed list of names always leaves
# gaps, and the gap shows up as music that stops playing.
#
# dnsmasq solves it properly: every address it resolves for these domains AND
# ALL THEIR SUBDOMAINS is added to the ipset automatically, the moment the
# client looks it up. The allowlist maintains itself.
#
# Listens on loopback only. Port 53 on 127.0.0.1 is free because systemd-resolved
# uses 127.0.0.53/.54 — and resolv.conf cannot express a port, so 53 it must be.
port=53
listen-address=127.0.0.1
bind-interfaces
no-dhcp-interface=
no-hosts
no-resolv
# Upstream: the host's own AdGuard Home, so tunnel lookups are filtered too.
server=127.0.0.1#5353
cache-size=1000

# --- Spotify: domain + every subdomain -> allowlist ipsets ---
ipset=/spotify.com/scdn.co/pscdn.co/spotifycdn.com/spotifycdn.net/spoti.fi/splittunnel-allow4,splittunnel-allow6
# CDN hostnames Spotify serves audio/artwork from (Akamai, Fastly, edgesuite)
ipset=/audio-ak-spotify-com.akamaized.net/audio4-ak-spotify-com.akamaized.net/splittunnel-allow4,splittunnel-allow6
ipset=/heads-ak-spotify-com.akamaized.net/heads4-ak-spotify-com.akamaized.net/splittunnel-allow4,splittunnel-allow6
ipset=/spotify.com.edgesuite.net/spotify.map.fastly.net/spotify.map.fastlylb.net/splittunnel-allow4,splittunnel-allow6

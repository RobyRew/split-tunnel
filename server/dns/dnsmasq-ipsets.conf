[Unit]
# ipsets live in the kernel and vanish on reboot. dnsmasq refuses to start when
# a set named in an ipset= line does not exist, so create them first or the
# resolver never comes back after a restart.
After=network-online.target

[Service]
ExecStartPre=-/usr/sbin/ipset create splittunnel-allow4 hash:ip family inet timeout 86400 -exist
ExecStartPre=-/usr/sbin/ipset create splittunnel-allow6 hash:ip family inet6 timeout 86400 -exist

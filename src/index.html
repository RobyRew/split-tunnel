<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SplitTunnel</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" class="mark" aria-hidden="true">
        <path d="M9 32h14" stroke="#475569" stroke-width="6" stroke-linecap="round" fill="none"/>
        <path d="M23 32 Q40 32 55 18" stroke="#475569" stroke-width="6" stroke-linecap="round" fill="none"/>
        <path d="M23 32 Q40 32 52 48" stroke="url(#g)" stroke-width="7" stroke-linecap="round" fill="none"/>
        <circle cx="23" cy="32" r="5" fill="#e8f0fe"/>
        <circle cx="52" cy="48" r="6" fill="#22d3ee"/>
        <defs><linearGradient id="g" x1="23" y1="32" x2="52" y2="48" gradientUnits="userSpaceOnUse">
          <stop stop-color="#10b981"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
      </svg>
      <div><h1>SplitTunnel</h1><p class="sub">One app through your server</p></div>
    </div>
    <span id="pill" class="pill stopped">Stopped</span>
  </header>

  <main>
    <section class="card">
      <h2>Server</h2>
      <label>Host <input id="host" placeholder="vps.example.com or IP" autocomplete="off" spellcheck="false" /></label>
      <div class="row">
        <label class="grow">User <input id="user" placeholder="tunnel" autocomplete="off" spellcheck="false" /></label>
        <label class="narrow">Port <input id="port" type="number" min="1" max="65535" /></label>
      </div>
      <label>Private key (.ppk) — leave empty to use a key already in Pageant
        <input id="key" placeholder="C:\Users\you\keys\tunnel.ppk" autocomplete="off" spellcheck="false" /></label>
    </section>

    <section class="card">
      <h2>Local proxy</h2>
      <label class="narrow">SOCKS5 port <input id="lport" type="number" min="1" max="65535" /></label>
      <p class="hint">Point the app at <code>127.0.0.1</code> : <code id="lporth">1080</code> (SOCKS5).</p>
    </section>

    <section class="card">
      <h2>Options</h2>
      <label class="check"><input type="checkbox" id="autostart" /> <span>Start with Windows</span></label>
      <label class="check"><input type="checkbox" id="spot" /> <span>Manage Spotify's proxy setting <em>(experimental — backs up prefs)</em></span></label>
    </section>

    <section class="card muted">
      <h2>Environment</h2>
      <p>Pageant: <b id="pag">checking…</b></p>
      <p class="path">plink: <span id="plink">—</span></p>
    </section>

    <p id="msg" class="msg"></p>
  </main>

  <footer>
    <button id="toggle" class="primary">Connect</button>
    <button id="save">Save</button>
  </footer>
  <script src="app.js"></script>
</body>
</html>
